<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><main>
<h1>LevKunimi · 같이 보기</h1><div class="row"><input id="name" placeholder="닉네임" value="Kunimi"><input id="r" placeholder="방 코드"><button id="j">방 들어가기</button></div><div id="st" class="status">대기 중</div><video id="v" autoplay playsinline controls></video>
<div class="chat"><div id="msgs"></div><div class="row"><input id="msg" placeholder="메시지"><button id="send">전송</button></div></div></main><script>
let w,p,myName="Kunimi";const URL=(location.protocol==="https:"?"wss://":"ws://")+location.host;
const by=id=>document.getElementById(id),r=by("r"),j=by("j"),st=by("st"),nameEl=by("name"),v=by("v"),msgs=by("msgs"),msg=by("msg"),send=by("send");
function add(n,t,me=false){let d=document.createElement("div");if(me)d.className="me";d.textContent=n+": "+t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
j.onclick=()=>{let room=r.value.trim().toUpperCase();myName=nameEl.value.trim()||"Kunimi";if(!room)return;w=new WebSocket(URL);
w.onopen=()=>{w.send(JSON.stringify({type:"join",role:"guest",room,name:myName}));st.textContent="방 "+room+" · 연결됨"};
w.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==="offer"){p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});p.ontrack=e=>{v.srcObject=e.streams[0];v.play().catch(()=>st.textContent="영상의 재생 버튼을 눌러줘")};p.onicecandidate=e=>e.candidate&&w.send(JSON.stringify({type:"ice",candidate:e.candidate}));await p.setRemoteDescription(m.offer);let a=await p.createAnswer();await p.setLocalDescription(a);w.send(JSON.stringify({type:"answer",answer:p.localDescription}))}if(m.type==="ice"&&p)try{await p.addIceCandidate(m.candidate)}catch{}if(m.type==="chat")add(m.name||"상대",m.text)}};
function sendChat(){let t=msg.value.trim();if(!t||!w||w.readyState!==1)return;w.send(JSON.stringify({type:"chat",name:myName,text:t}));add("나",t,true);msg.value=""}
send.onclick=sendChat;msg.onkeydown=e=>{if(e.key==="Enter")sendChat()};
</script>
