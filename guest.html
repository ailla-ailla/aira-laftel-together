<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><main><h1>LevKunimi · 같이 보기</h1><input id="r" placeholder="방 코드"><button id="j">방 들어가기</button><div id="st" class="status">대기 중</div><video id="v" autoplay playsinline controls></video></main><script>
let w,p;const $=x=>document.getElementById(x),URL=(location.protocol==="https:"?"wss://":"ws://")+location.host;
j.onclick=()=>{let room=r.value.trim().toUpperCase();if(!room)return;w=new WebSocket(URL);w.onopen=()=>{w.send(JSON.stringify({type:"join",role:"guest",room}));st.textContent="방 "+room+" · 연결됨"};w.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==="offer"){p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});p.ontrack=e=>{v.srcObject=e.streams[0];v.play().catch(()=>st.textContent="영상의 재생 버튼을 눌러줘")};p.onicecandidate=e=>e.candidate&&w.send(JSON.stringify({type:"ice",candidate:e.candidate}));await p.setRemoteDescription(m.offer);let a=await p.createAnswer();await p.setLocalDescription(a);w.send(JSON.stringify({type:"answer",answer:p.localDescription}))}if(m.type==="ice"&&p)try{await p.addIceCandidate(m.candidate)}catch{}}}</script>
