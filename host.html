<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><main>
<h1>LevKunimi · 보내기</h1><div class="row"><input id="nickname" value="쿠니미" placeholder="닉네임"><input id="room" placeholder="방 코드"><button id="makeRoom">코드 만들기</button><button id="share">화면 공유 시작</button></div><div id="status" class="status">대기 중</div>
<div class="chat"><div id="msgs"></div><div class="row"><input id="message" placeholder="메시지"><button id="sendBtn">전송</button></div></div></main><script>
let ws,pc,stream,myName="쿠니미";const clientId=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);
const WSURL=(location.protocol==="https:"?"wss://":"ws://")+location.host;
const nickname=document.getElementById("nickname"),room=document.getElementById("room"),makeRoom=document.getElementById("makeRoom"),share=document.getElementById("share"),status=document.getElementById("status"),msgs=document.getElementById("msgs"),message=document.getElementById("message"),sendBtn=document.getElementById("sendBtn");
makeRoom.onclick=()=>room.value=Math.random().toString(36).slice(2,8).toUpperCase();
function add(n,t,me=false){const d=document.createElement("div");if(me)d.className="me";d.textContent=n+": "+t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
async function offer(){if(pc)pc.close();pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:"ice",candidate:e.candidate}));const o=await pc.createOffer();await pc.setLocalDescription(o);ws.send(JSON.stringify({type:"offer",offer:pc.localDescription}))}
share.onclick=async()=>{const code=room.value.trim().toUpperCase();myName=nickname.value.trim()||"쿠니미";if(!code){alert("방 코드를 만들어줘.");return}
try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});status.textContent="연결 준비 중…";ws=new WebSocket(WSURL);ws.onopen=()=>{ws.send(JSON.stringify({type:"join",role:"host",room:code,name:myName,id:clientId}));status.textContent="방 "+code+" · 공유 중"};
ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==="peer")await offer();else if(m.type==="answer"&&pc)await pc.setRemoteDescription(m.answer);else if(m.type==="ice"&&pc)try{await pc.addIceCandidate(m.candidate)}catch{}else if(m.type==="chat"&&m.id!==clientId)add(m.name||"상대",m.text)};
stream.getVideoTracks()[0].onended=()=>status.textContent="공유 종료"}catch(e){status.textContent="공유 시작 실패: "+e.message}};
function sendChat(){const t=message.value.trim();if(!t||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:"chat",name:myName,text:t,id:clientId}));add("나",t,true);message.value=""}sendBtn.onclick=sendChat;message.onkeydown=e=>{if(e.key==="Enter")sendChat()};
</script>
