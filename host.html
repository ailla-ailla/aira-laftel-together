<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><main><h1>LevKunimi · 보내기</h1><input id="r" placeholder="방 코드"><button id="g">코드 만들기</button><button id="s">화면 공유 시작</button><div id="st" class="status">대기 중</div></main><script>
let w,p,stream;const $=x=>document.getElementById(x),URL=(location.protocol==="https:"?"wss://":"ws://")+location.host;
g.onclick=()=>r.value=Math.random().toString(36).slice(2,8).toUpperCase();
async function offer(){if(p)p.close();p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});stream.getTracks().forEach(t=>p.addTrack(t,stream));p.onicecandidate=e=>e.candidate&&w.send(JSON.stringify({type:"ice",candidate:e.candidate}));let o=await p.createOffer();await p.setLocalDescription(o);w.send(JSON.stringify({type:"offer",offer:p.localDescription}))}
s.onclick=async()=>{let room=r.value.trim().toUpperCase();if(!room)return alert("방 코드를 만들어줘");try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});w=new WebSocket(URL);w.onopen=()=>{w.send(JSON.stringify({type:"join",role:"host",room}));st.textContent="방 "+room+" · 공유 중"};w.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==="peer")await offer();if(m.type==="answer")await p.setRemoteDescription(m.answer);if(m.type==="ice"&&p)try{await p.addIceCandidate(m.candidate)}catch{}}}catch(e){st.textContent="공유 시작 실패: "+e.message}}</script>
