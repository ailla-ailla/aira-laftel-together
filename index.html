<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LevKunimi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111116;color:#f6f6f7;font-family:system-ui,sans-serif}
header{padding:14px 16px;font-weight:700;border-bottom:1px solid #30303a}
.card{margin:12px;padding:14px;background:#1b1b22;border:1px solid #343440;border-radius:14px}
input,button{font:inherit;border-radius:10px;padding:11px}input{width:100%;background:#262630;color:white;border:1px solid #494956;margin:5px 0}
button{border:0;background:#7b61ff;color:white;font-weight:700}.row{display:flex;gap:8px}.row>*{flex:1}
#chat{display:none;height:58vh;flex-direction:column}.messages{flex:1;overflow:auto;background:#101014;border-radius:10px;padding:10px;margin:8px 0}
.msg{margin:7px 0}.msg b{display:block;font-size:11px;color:#aaa}.hint{color:#aaa;font-size:13px;line-height:1.5}
#state{padding:9px;background:#24242c;border-radius:10px;font-size:13px}
a{color:#b8aaff}
</style></head>
<body>
<header>LevKunimi · 모바일 시험판</header>
<div class="card" id="join">
  <div class="hint">이 시험판은 먼저 <b>채팅 연결</b>과 모바일 환경을 확인하기 위한 버전이야. 라프텔은 아래 버튼으로 공식 사이트를 별도 탭에서 열어.</div>
  <input id="name" placeholder="닉네임">
  <input id="room" placeholder="방 코드">
  <div class="row"><button id="random">방 코드 생성</button><button id="enter">방 들어가기</button></div>
  <p><button id="laftel">라프텔 열기</button></p>
</div>
<div class="card" id="chat">
  <div id="status">연결 중…</div>
  <div id="state">PC 재생 신호 대기 중</div>
  <div class="messages" id="messages"></div>
  <form class="row" id="form"><input id="text" placeholder="메시지"><button>전송</button></form>
</div>
<script>
let ws, room="", name="", id="";
const $=x=>document.querySelector(x);
function add(text,who="알림"){const d=document.createElement("div");d.className="msg";const b=document.createElement("b");b.textContent=who;const s=document.createElement("span");s.textContent=text;d.append(b,s);$("#messages").append(d);$("#messages").scrollTop=999999}
$("#random").onclick=()=>$("#room").value=Math.random().toString(36).slice(2,8).toUpperCase();
$("#laftel").onclick=()=>window.open("https://laftel.net","_blank");
$("#enter").onclick=()=>{
 name=$("#name").value.trim()||"익명";room=$("#room").value.trim().toUpperCase();if(!room)return alert("방 코드를 입력해줘.");
 const proto=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(proto+"://"+location.host);
 ws.onopen=()=>{ws.send(JSON.stringify({type:"join",room,name}));$("#join").style.display="none";$("#chat").style.display="flex";$("#status").textContent=`방 ${room} · 연결됨`;};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.type==="hello")id=m.clientId;
   if(m.type==="chat")add(m.text,m.name);
   if(m.type==="system")add(m.text);
   if(m.type==="state"){const t=Math.max(0,Number(m.time)||0),mm=Math.floor(t/60),ss=Math.floor(t%60).toString().padStart(2,"0");$("#state").textContent=`PC: ${mm}:${ss} · ${m.paused?"일시정지":"재생 중"}`;}
 };
};
$("#form").onsubmit=e=>{e.preventDefault();const t=$("#text").value.trim();if(t&&ws?.readyState===1){ws.send(JSON.stringify({type:"chat",text:t,room,name}));$("#text").value=""}};
</script></body></html>
